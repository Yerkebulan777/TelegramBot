# Qodana configuration file
# For more information, see https://www.jetbrains.com/help/qodana/dotnet.html

# The linter to use
linter: jetbrains/qodana-dotnet:latest

# Project name (optional)
project: TelegramBot

# Path to the solution or project file
dotnet:
  solution: TelegramBot.slnx

# Qodana Community for .NET runs in Linux Docker. Restore inside that container
# so its MSBuild process has project.assets.json for every project.
bootstrap: |
  dotnet restore TelegramBot.slnx

# Inspection profile
profile:
  name: qodana.recommended

# Severity thresholds — fail build on any issue
severityThresholds:
  any: 0

# Exclude directories
exclude:
  - name: All
    paths:
      - .idea
      - .git
      - "**/bin"
      - "**/obj"
