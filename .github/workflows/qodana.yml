name: Qodana Code Quality

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Qodana Scan
      uses: JetBrains/qodana-action@v2024.3
      with:
        pr-mode: false
