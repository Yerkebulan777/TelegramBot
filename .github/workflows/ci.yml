name: CI

on:
  push:
    branches: [ main, master, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Валидация commit messages: fix #N → Issue exists
  # ──────────────────────────────────────────────
  validate-issue-refs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # полная история для git log на push

    - name: Validate fix #N references existing issues
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail

        # ── 1. Collect commit messages ──
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          # PR: через API (fetch-depth=0 не даёт PR-commits при checkout без ref)
          echo "📥 Collecting commits from PR #${{ github.event.pull_request.number }}..."
          COMMITS=$(gh api "${{ github.event.pull_request.commits_url }}" --jq '.[].commit.message' 2>/dev/null)
        else
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            # Первый push в ветку — проверяем все коммиты
            echo "📥 First push to branch — checking all commits..."
            COMMITS=$(git log --format=%B "$AFTER" 2>/dev/null || true)
          else
            echo "📥 Collecting commits from $BEFORE..$AFTER..."
            COMMITS=$(git log --format=%B "$BEFORE..$AFTER" 2>/dev/null || true)
          fi
        fi

        if [[ -z "$COMMITS" ]]; then
          echo "⚠️  No commits to inspect — skipping validation"
          exit 0
        fi

        # ── 2. Extract issue references ──
        # Паттерны: fix #N, fixes #N, fixed #N, close #N, closes #N, closed #N,
        #            resolve #N, resolves #N, resolved #N (case-insensitive)
        ISSUES=$(echo "$COMMITS" | grep -oiP '(?:fix|fixed|fixes|close|closes|closed|resolve|resolves|resolved)\s+#(\d+)' | grep -oP '\d+' | sort -un || true)

        if [[ -z "$ISSUES" ]]; then
          echo "✅ No issue references (fix #N) found in commit messages — skipping validation"
          exit 0
        fi

        # ── 3. Validate each issue exists ──
        echo ""
        echo "🔍 Found issue references: $(echo "$ISSUES" | tr '\n' ' ')"
        echo ""

        FAILED=0
        for ISSUE in $ISSUES; do
          if gh issue view "$ISSUE" --repo "${{ github.repository }}" --json number &>/dev/null; then
            echo "  ✅ #$ISSUE — exists"
          else
            echo "  ❌ #$ISSUE — does NOT exist in ${{ github.repository }}"
            FAILED=1
          fi
        done

        echo ""
        if [[ $FAILED -eq 1 ]]; then
          echo "❌ Some referenced issues do not exist. Create them or fix commit messages."
          exit 1
        fi
        echo "✅ All referenced issues exist."

  # ──────────────────────────────────────────────
  # Build & publish
  # ──────────────────────────────────────────────
  build:
    runs-on: windows-latest  # Worker требует Windows
    needs: [validate-issue-refs]

    steps:
    - uses: actions/checkout@v4

    - name: Validate BIM XML Schemas (TaskFile + ResultFile)
      shell: pwsh
      run: |
        ./scripts/validate-bim-schemas.ps1

    - name: Ensure no unwanted files are tracked by Git
      shell: bash
      run: |
        echo "🔍 Checking for unwanted files tracked in repository..."
        UNWANTED_FILES=$(git ls-files | grep -iE '(\.vs/|^bin/|^obj/|\.user$|\.suo$|appsettings\.Local\.json$|\.idea/|\.vscode/)' || true)
        if [ ! -z "$UNWANTED_FILES" ]; then
          echo "❌ ERROR: Found files tracked by Git that should be ignored by .gitignore:"
          echo "$UNWANTED_FILES"
          echo ""
          echo "To fix this, run these commands locally on your machine:"
          echo "  git rm -r --cached ."
          echo "  git add ."
          echo "  git commit -m \"chore: clear git index and apply .gitignore\""
          exit 1
        fi
        echo "✅ No unwanted tracked files found."

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Restore dependencies
      run: dotnet restore TelegramBot.slnx

    - name: Build
      run: dotnet build TelegramBot.slnx --no-restore --configuration Release

    - name: Publish Server
      run: dotnet publish TelegramBot.Server/TelegramBot.Server.csproj -c Release -o ./publish/server

    - name: Publish Worker
      run: dotnet publish TelegramBot.Worker/TelegramBot.Worker.csproj -c Release -o ./publish/worker

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: telegram-bot-build
        path: ./publish

    - name: Publish Server (for installer)
      run: dotnet publish TelegramBot.Server/TelegramBot.Server.csproj -c Release -o ./Installer/publish/Server

    - name: Publish Worker (for installer)
      run: dotnet publish TelegramBot.Worker/TelegramBot.Worker.csproj -c Release -o ./Installer/publish/Worker

    - name: Publish GrantLogonRight (for installer)
      run: dotnet publish Installer/GrantLogonRight/GrantLogonRight.csproj -c Release -o ./Installer/publish/GrantLogonRight

    - name: Build installer (Inno Setup, preinstalled on windows-latest)
      shell: pwsh
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" Installer\TelegramBot.iss

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: telegram-bot-installer
        path: ./Installer/Output/TelegramBotSetup.exe

  # ──────────────────────────────────────────────
  # Qodana Code Quality (Community for .NET, ReSharper-based, Docker-only)
  # QODANA_TOKEN опционален — нужен только для загрузки отчётов в Qodana Cloud
  # Чтобы добавить Cloud: создать secret QODANA_TOKEN и раскомментировать env ниже
  # ──────────────────────────────────────────────
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}  # анализировать реальный коммит PR, не merge-коммит
        fetch-depth: 0  # полная история нужна для инкрементального анализа PR

    - name: Cache Qodana
      uses: actions/cache@v4
      with:
        path: ~/.qodana/cache
        key: qodana-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          qodana-${{ runner.os }}-${{ github.ref }}-
          qodana-${{ runner.os }}-

    - name: Qodana Scan
      uses: JetBrains/qodana-action@v2026.1
      with:
        pr-mode: false
        cache-dir: ~/.qodana/cache
        args: |
          --linter qodana-cdnet
          --solution TelegramBot.slnx
      # env:
      #   QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}  # раскомментировать для Qodana Cloud
