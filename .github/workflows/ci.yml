name: .NET CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore TelegramBot.slnx

    - name: Check Code Style (Lint)
      run: dotnet format TelegramBot.slnx --verify-no-changes --no-restore --verbosity diagnostic

    - name: Build
      run: dotnet build --no-restore --configuration Release TelegramBot.slnx

    - name: Publish
      run: dotnet publish -c Release -o ./publish TelegramBot.Server/TelegramBot.Server.csproj

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bot-release
        path: ./publish
