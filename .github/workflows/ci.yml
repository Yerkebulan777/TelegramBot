name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest  # Worker требует Windows

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore TelegramBot.slnx

    - name: Build
      run: dotnet build TelegramBot.slnx --no-restore --configuration Release

    - name: Check code style
      run: dotnet format TelegramBot.slnx --verify-no-changes

    - name: Publish Server
      run: dotnet publish TelegramBot.Server/TelegramBot.Server.csproj -c Release -o ./publish/server

    - name: Publish Worker
      run: dotnet publish TelegramBot.Worker/TelegramBot.Worker.csproj -c Release -o ./publish/worker

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: telegram-bot-build
        path: ./publish
