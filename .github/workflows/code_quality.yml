name: Qodana Code Quality

# Бесплатная версия: Qodana Community for .NET (qodana-cdnet)
# Основана на ReSharper, Docker-only, C# + VB.NET + C/C++
# QODANA_TOKEN опционален — нужен только для загрузки отчётов в Qodana Cloud
# Чтобы добавить Cloud: создать secret QODANA_TOKEN и раскомментировать env ниже

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    runs-on: ubuntu-latest
    env:
      BIM_CONTRACT_DIRECTORY: ${{ github.workspace }}/.contract/RevitBIMFusion/Docs
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}  # анализировать реальный коммит PR, не merge-коммит
        fetch-depth: 0  # полная история нужна для инкрементального анализа PR

    - name: Checkout canonical BIM contract
      uses: actions/checkout@v4
      with:
        repository: Yerkebulan777/RevitBIMFusion
        ref: master
        path: .contract/RevitBIMFusion
        sparse-checkout: Docs

    - name: Cache Qodana
      uses: actions/cache@v4
      with:
        path: ~/.qodana/cache
        key: qodana-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          qodana-${{ runner.os }}-${{ github.ref }}-
          qodana-${{ runner.os }}-

    - name: Qodana Scan
      uses: JetBrains/qodana-action@v2026.1
      with:
        pr-mode: false
        cache-dir: ~/.qodana/cache
        args: |
          --linter qodana-cdnet
          --solution TelegramBot.slnx
      # env:
      #   QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}  # раскомментировать для Qodana Cloud
